<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="/reset-password.css">

</head>
<body>

<!-- Password Reset Page -->
<div class="container">
   <h2>Reset Password</h2>
   <form id="reset-password-form">
    <label for="new-password">New Password:</label>
    <input type="password" id="new-password" name="new-password" required>
    <label for="confirm-password">Confirm Password:</label>
    <input type="password" id="confirm-password" name="confirm-password" required>
    <button type="submit">Reset Password</button>
    <div id="reset-message"></div>
   </form>
</div>
</body>

<script>
document.getElementById('reset-password-form').addEventListener('submit', async function(event) {
    event.preventDefault();
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const email = sessionStorage.getItem('email');

    // Password strength check
    const passwordPattern = /^(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{6,}$/;
    if (!passwordPattern.test(newPassword)) {
        document.getElementById('reset-message').textContent = "Password must be at least 6 characters long and include at least one special character.";
        return;
    }

    if (newPassword !== confirmPassword) {
        document.getElementById('reset-message').textContent = "Passwords do not match";
        return;
    }

    const response = await fetch('/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, newPassword })
    });

    if (response.ok) {
        window.location.href = '/login.html';
    } else {
        const message = await response.text();
        document.getElementById('reset-message').textContent = message;
    }
});
</script>
</html>

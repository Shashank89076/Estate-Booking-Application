<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="/signup.css">
</head>
<body>

    <div class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="username" placeholder="Enter your name" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <a href="Forgotpassword.html" id="forgot-password-link">Forgot Password?</a>
          </div>
          <button type="submit" class="submit-btn">Login</button>
        </form>
        <div id="errorMessage" style="color:red;"></div>
        <p>Don't have an account? <a class="link" href="signup.html">SignUp</a></p>
      </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const username = document.getElementById('name').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const result = await response.text();
            const errorMessageDiv = document.getElementById('errorMessage');

            if (response.ok) {
              sessionStorage.setItem('username', username); // Store username in session storage
              window.location.href = 'Main-2.html';
            } else {
                errorMessageDiv.textContent = result;
            }
        });
        document.addEventListener('DOMContentLoaded', () => {
            const username = sessionStorage.getItem('username');
            if (username) {
                document.getElementById('login').innerText = `Hello, ${username}`;
            }
          });
          
    </script>
</body>
</html>
